<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js - 3 Objects Orbiting Hiro Marker</title>
    <!-- นำเข้า A-Frame -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- นำเข้า AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- สร้าง Scene ของ AR.js -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- ตั้งค่า Marker เป็น HIRO -->
      <a-marker preset="hiro">
        
        <!-- ศูนย์กลางการหมุน (Pivot): ใช้ Animation หมุนแกน Y (0 ถึง 360 องศา) แบบวนลูป -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
          
          <!-- วัตถุชิ้นที่ 1 (สีแดง) -->
          <!-- หมุนจุดตั้งต้นไปที่ 0 องศา แล้วผลักกล่องออกไปตามแกน X -->
          <a-entity rotation="0 0 0">
            <a-box position="1.5 0.5 0" scale="0.5 0.5 0.5" color="red"></a-box>
          </a-entity>
          
          <!-- วัตถุชิ้นที่ 2 (สีเขียว) -->
          <!-- หมุนจุดตั้งต้นไปที่ 120 องศา แล้วผลักกล่องออกไป -->
          <a-entity rotation="0 120 0">
            <a-box position="1.5 0.5 0" scale="0.5 0.5 0.5" color="green"></a-box>
          </a-entity>
          
          <!-- วัตถุชิ้นที่ 3 (สีน้ำเงิน) -->
          <!-- หมุนจุดตั้งต้นไปที่ 240 องศา แล้วผลักกล่องออกไป -->
          <a-entity rotation="0 240 0">
            <a-box position="1.5 0.5 0" scale="0.5 0.5 0.5" color="blue"></a-box>
          </a-entity>

        </a-entity>

      </a-marker>
      
      <!-- กล้องสำหรับมองภาพ AR -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
