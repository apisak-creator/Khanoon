<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>5 Buffaloes Running Around HIRO Marker</title>
    <!-- โหลดไลบรารี A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">
    <!-- สร้าง Scene สำหรับ AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- โหลด Assets (โมเดล 3D) -->
      <a-assets>
        <!-- ⚠️ สำคัญ: คุณต้องนำ URL ของไฟล์โมเดล 3D ควาย (.glb หรือ .gltf) มาใส่ในช่อง src -->
        <a-asset-item id="buffalo-model" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF/Fox.gltf"></a-asset-item>
        <!-- หมายเหตุ: โค้ดนี้ใช้โมเดลหมาจิ้งจอกเป็นตัวอย่างชั่วคราวเพื่อให้รันได้ทันที กรุณาเปลี่ยน src เป็นโมเดลควายของคุณ -->
      </a-assets>

      <!-- กำหนด HIRO Marker -->
      <a-marker preset="hiro">
        
        <!-- ศูนย์กลางการหมุน: ทำให้ทุกอย่างในนี้หมุน 360 องศารอบแกน Y อย่างต่อเนื่อง -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
          
          <!-- ควายตัวที่ 1 (มุม 0 องศา) -->
          <a-entity rotation="0 0 0">
            <!-- วางตำแหน่งให้ห่างจากจุดศูนย์กลาง (รัศมี 1.5) และหันหน้าไปตามเส้นรอบวง (rotation="0 90 0") -->
            <a-entity gltf-model="#buffalo-model" position="1.5 0 0" rotation="0 90 0" scale="0.02 0.02 0.02"></a-entity>
          </a-entity>

          <!-- ควายตัวที่ 2 (มุม 72 องศา) -->
          <a-entity rotation="0 72 0">
            <a-entity gltf-model="#buffalo-model" position="1.5 0 0" rotation="0 90 0" scale="0.02 0.02 0.02"></a-entity>
          </a-entity>

          <!-- ควายตัวที่ 3 (มุม 144 องศา) -->
          <a-entity rotation="0 144 0">
            <a-entity gltf-model="#buffalo-model" position="1.5 0 0" rotation="0 90 0" scale="0.02 0.02 0.02"></a-entity>
          </a-entity>

          <!-- ควายตัวที่ 4 (มุม 216 องศา) -->
          <a-entity rotation="0 216 0">
            <a-entity gltf-model="#buffalo-model" position="1.5 0 0" rotation="0 90 0" scale="0.02 0.02 0.02"></a-entity>
          </a-entity>

          <!-- ควายตัวที่ 5 (มุม 288 องศา) -->
          <a-entity rotation="0 288 0">
            <a-entity gltf-model="#buffalo-model" position="1.5 0 0" rotation="0 90 0" scale="0.02 0.02 0.02"></a-entity>
          </a-entity>

        </a-entity>
        
      </a-marker>

      <!-- กล้อง -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
